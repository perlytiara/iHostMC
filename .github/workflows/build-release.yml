name: Build release

# Only one build per release: run on tag push (e.g. v0.5.4) or manual trigger. No branch push.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - os: macos-14
            name: macOS (Apple Silicon)
            artifact: macos-arm64-bundle
          - os: macos-13
            name: macOS (Intel)
            artifact: macos-intel-bundle
          - os: windows-latest
            name: Windows
            artifact: windows-bundle
          - os: ubuntu-22.04
            name: Linux
            artifact: linux-bundle
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Ensure env
        run: npm run ensure-env

      - name: Verify signing key (fail fast before long build)
        run: |
          node -e "require('fs').writeFileSync('verify.bin','x')"
          npx tauri signer sign verify.bin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sync version and run tests
        run: npm run sync-version && npm run test:run

      - name: Build Tauri
        run: npm run build:public
        env:
          VITE_API_BASE_URL: https://api.ihost.one
          VITE_WEBSITE_URL: https://ihost.one
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        if: matrix.artifact == 'windows-bundle'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.tar.*

      - name: Upload macOS ARM64 artifacts
        if: matrix.artifact == 'macos-arm64-bundle'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/dmg/*.sig
            src-tauri/target/release/bundle/macos/*.sig

      - name: Upload macOS Intel artifacts
        if: matrix.artifact == 'macos-intel-bundle'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/dmg/*.sig
            src-tauri/target/release/bundle/macos/*.sig

      - name: Upload Linux artifacts
        if: matrix.artifact == 'linux-bundle'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/*/*.tar.*
            src-tauri/target/release/bundle/*/*.sig

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: artifacts/windows

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-bundle
          path: artifacts/macos-arm64
          merge-multiple: true

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-bundle
          path: artifacts/macos-intel
          merge-multiple: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: artifacts/linux
          merge-multiple: true

      - name: Generate latest.json for updater (Windows + macOS)
        run: |
          node scripts/gen-latest-json.cjs \
            --input-dir artifacts \
            --output artifacts/latest.json

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: iHostMC ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          body: |
            ## iHostMC v${{ steps.version.outputs.version }}

            Minecraft server manager — create, run, and back up servers. Share with friends via the iHost relay (no port forwarding). In-app updates are enabled on **Windows (x64)** and **macOS (Apple Silicon + Intel)**.

            ### Highlights

            - Release built automatically for macOS (Apple Silicon + Intel), Windows, and Linux.
            - See installer links below for your platform.

            ---

            ### Downloads

            **macOS (Apple Silicon, arm64)**

            | File | Notes |
            |------|--------|
            | **[iHostMC_${{ steps.version.outputs.version }}_aarch64.dmg](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/iHostMC_${{ steps.version.outputs.version }}_aarch64.dmg)** | Installer disk image for Apple Silicon Macs |
            | **[latest.json](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/latest.json)** | Updater manifest used by the app |

            **macOS (Intel, x64)**

            | File | Notes |
            |------|--------|
            | **[iHostMC_${{ steps.version.outputs.version }}_x64.dmg](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/iHostMC_${{ steps.version.outputs.version }}_x64.dmg)** | Installer disk image for Intel Macs |
            | **[latest.json](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/latest.json)** | Updater manifest used by the app |

            **Windows (x64)**

            | File | Notes |
            |------|--------|
            | **[iHostMC_${{ steps.version.outputs.version }}_x64-setup.exe](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/iHostMC_${{ steps.version.outputs.version }}_x64-setup.exe)** | NSIS installer (recommended); supports the in-app updater |
            | **[iHostMC_${{ steps.version.outputs.version }}_x64_en-US.msi](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/iHostMC_${{ steps.version.outputs.version }}_x64_en-US.msi)** | MSI installer |
            | **[latest.json](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/latest.json)** | Updater manifest used by the app |

            **Linux (x86_64)**

            | File | Notes |
            |------|--------|
            | **[iHostMC_${{ steps.version.outputs.version }}_amd64.deb](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/iHostMC_${{ steps.version.outputs.version }}_amd64.deb)** | Debian, Ubuntu, Mint, Pop!_OS, etc. Install: `sudo apt install ./iHostMC_${{ steps.version.outputs.version }}_amd64.deb` (or use your GUI package installer) |
            | **[iHostMC-${{ steps.version.outputs.version }}-1.x86_64.rpm](https://github.com/perlytiara/iHostMC/releases/download/v${{ steps.version.outputs.version }}/iHostMC-${{ steps.version.outputs.version }}-1.x86_64.rpm)** | Fedora, RHEL, Alma, Rocky, openSUSE. Install: `sudo dnf install ./iHostMC-${{ steps.version.outputs.version }}-1.x86_64.rpm` (or `zypper` / `rpm` as appropriate) |

            Each `.exe`, `.msi`, `.deb`, and `.rpm` has a matching **`.sig`** file in **Assets** for optional signature verification ([Tauri signing](https://v2.tauri.app/distribute/#signing)).

            ---

            ### Updating

            On Windows and macOS (Apple Silicon or Intel), open iHostMC — it will offer an update when a newer build is available — or reinstall from the installer above. On Linux, install the new `.deb` or `.rpm` over the previous version.
          draft: false
          files: |
            artifacts/windows/**
            artifacts/macos-arm64/**
            artifacts/macos-intel/**
            artifacts/linux/**
            artifacts/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
